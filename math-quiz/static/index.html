<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Latihan Matematika</title>
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <main class="card">

    <!-- Layar 1: pilih topik -->
    <section id="home" class="screen">
      <h1>Latihan Matematika</h1>
      <p class="sub">Pilih topik, lalu kerjakan 10 soal.</p>
      <div id="topics" class="topics">Memuat topik…</div>
    </section>

    <!-- Layar 2: mengerjakan soal -->
    <section id="quiz" class="screen hidden">
      <header class="quiz-head">
        <button id="btn-back" class="link" type="button">← Menu</button>
        <span id="topic-title" class="topic-name"></span>
        <span id="progress-text" class="progress-text"></span>
      </header>
      <div class="bar"><div id="bar-fill"></div></div>

      <div id="streak" class="streak hidden" aria-live="polite">
        <span class="streak-n">×2</span>
        <span class="streak-t">Streak!</span>
      </div>

      <div id="prompt" class="prompt"></div>
      <div id="answer-area" class="answer-area"></div>

      <div id="feedback" class="feedback hidden" aria-live="polite"></div>

      <div class="actions">
        <button id="btn-check" class="primary" type="button" disabled>Periksa</button>
        <button id="btn-next" class="primary hidden" type="button">Lanjut</button>
      </div>
    </section>

    <!-- Layar 3: hasil -->
    <section id="result" class="screen hidden">
      <div id="result-emoji" class="result-emoji"></div>
      <h1 id="result-score"></h1>
      <p id="result-msg" class="sub"></p>
      <div class="actions">
        <button id="btn-retry" class="primary" type="button">Coba lagi (soal baru)</button>
        <button id="btn-menu" class="secondary" type="button">Pilih topik lain</button>
      </div>

      <h2 class="review-title">Review jawabanmu</h2>
      <div id="review-filter" class="review-filter"></div>
      <div id="review-list" class="review-list"></div>
    </section>

  </main>
  <script src="app.js?v=4"></script>
</body>
</html>
